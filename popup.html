<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eaf6fc">
  <title>양파군 대피소</title>
  <link rel="icon" href="icons/icon128.png">
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      width: 390px;
    }

    body {
      background: #eaf6fc;
      color: #10202a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      min-height: 560px;
      width: 390px;
    }

    header {
      background: rgba(234, 246, 252, 0.94);
      border-bottom: 1px solid #c7dfeb;
      padding: 14px 16px 10px;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    h1 {
      font-size: 20px;
      line-height: 1.2;
      margin: 0 0 10px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tabs a {
      background: #ffffff;
      border: 1px solid #b8d8e6;
      border-radius: 999px;
      color: #264a5b;
      flex: 0 0 auto;
      font-size: 13px;
      padding: 7px 11px;
      text-decoration: none;
    }

    main {
      margin: 0 auto;
      max-width: 780px;
      padding: 14px 12px 28px;
    }

    section {
      margin-bottom: 24px;
      scroll-margin-top: 98px;
    }

    h2 {
      font-size: 16px;
      line-height: 1.3;
      margin: 0 0 10px;
    }

    .emoji-grid {
      display: grid;
      gap: 9px;
      grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
    }

    .emoji-button {
      align-items: center;
      aspect-ratio: 1 / 1.12;
      background: #f8fdff;
      border: 1px solid #91c9df;
      border-radius: 8px;
      color: #00131c;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      font-size: 13px;
      justify-content: center;
      padding: 5px;
      touch-action: manipulation;
    }

    .emoji-button:active {
      background: #dff2fb;
      transform: translateY(1px);
    }

    .emoji-button img {
      height: min(58px, 66%);
      image-rendering: auto;
      object-fit: contain;
      width: min(58px, 86%);
    }

    .emoji-button span {
      display: block;
      line-height: 1.2;
      margin-top: 4px;
      white-space: nowrap;
    }

    .toast {
      background: rgba(0, 0, 0, 0.82);
      border-radius: 999px;
      bottom: 22px;
      color: #ffffff;
      font-size: 15px;
      left: 50%;
      opacity: 0;
      padding: 10px 16px;
      pointer-events: none;
      position: fixed;
      transform: translate(-50%, 12px);
      transition: opacity 140ms ease, transform 140ms ease;
      z-index: 3;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    footer {
      color: #4f6673;
      font-size: 12px;
      line-height: 1.5;
      margin: 22px auto 0;
      max-width: 560px;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>양파군 대피소</h1>
    <nav class="tabs" id="category-tabs" aria-label="양파군 분류"></nav>
  </header>
  <main id="app"></main>
  <div class="toast" id="toast" role="status" aria-live="polite">복사했습니다.</div>
  <script src="mobile.js"></script>
</body>
</html>
