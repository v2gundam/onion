      height: 100%;

      position: fixed;

      top: 50%;
      left: 30vw;
      display: none;
      color: white;
      text-decoration: solid;
      font-size: xx-large;
    }


    .notification-container.show {

    }

    .copyright-notice {
      color: #4f6673;

      line-height: 1.5;
      margin: 16px 0 10px;
      text-align: center;
    }
