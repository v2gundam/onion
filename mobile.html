<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eaf6fc">
  <title>양파군 대피소</title>
  <link rel="manifest" href="site.webmanifest">
  <link rel="icon" href="icons/icon128.png">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background: #eaf6fc;
      color: #10202a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      min-height: 100vh;
    }

    header {
      background: rgba(234, 246, 252, 0.94);
      border-bottom: 1px solid #c7dfeb;
      padding: 14px 16px 10px;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    h1 {
      font-size: 20px;
      line-height: 1.2;
      margin: 0;
    }

    .header-row {
      align-items: center;
      display: flex;
      gap: 12px;
      justify-content: space-between;
      margin: 0 0 10px;
    }

    .install-button,
    .install-primary,
    .install-secondary,
    .install-close {
      appearance: none;
      border-radius: 8px;
      cursor: pointer;
      font: inherit;
      touch-action: manipulation;
    }

    .install-button {
      background: #ffffff;
      border: 1px solid #7fb9d0;
      color: #173a4a;
      flex: 0 0 auto;
      font-size: 13px;
      line-height: 1.2;
      padding: 7px 10px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tabs a {
      background: #ffffff;
      border: 1px solid #b8d8e6;
      border-radius: 999px;
      color: #264a5b;
      flex: 0 0 auto;
      font-size: 13px;
      padding: 7px 11px;
      text-decoration: none;
    }

    main {
      margin: 0 auto;
      max-width: 780px;
      padding: 14px 12px 28px;
    }

    section {
      margin-bottom: 24px;
      scroll-margin-top: 98px;
    }

    h2 {
      font-size: 16px;
      line-height: 1.3;
      margin: 0 0 10px;
    }

    .emoji-grid {
      display: grid;
      gap: 9px;
      grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
    }

    .emoji-button {
      align-items: center;
      aspect-ratio: 1 / 1.12;
      background: #f8fdff;
      border: 1px solid #91c9df;
      border-radius: 8px;
      color: #00131c;
      display: flex;
      flex-direction: column;
      font-size: 13px;
      justify-content: center;
      padding: 5px;
      touch-action: manipulation;
    }

    .emoji-button:active {
      background: #dff2fb;
      transform: translateY(1px);
    }

    .emoji-button img {
      height: min(58px, 66%);
      image-rendering: auto;
      object-fit: contain;
      width: min(58px, 86%);
    }

    .emoji-button span {
      display: block;
      line-height: 1.2;
      margin-top: 4px;
      white-space: nowrap;
    }

    .load-error {
      background: #f8fdff;
      border: 1px solid #b8d8e6;
      border-radius: 8px;
      color: #2d4b59;
      line-height: 1.55;
      padding: 16px;
    }

    .load-error h2 {
      color: #10202a;
    }

    .load-error p {
      margin: 0;
    }

    .toast {
      background: rgba(0, 0, 0, 0.82);
      border-radius: 999px;
      bottom: 22px;
      color: #ffffff;
      font-size: 15px;
      left: 50%;
      opacity: 0;
      padding: 10px 16px;
      pointer-events: none;
      position: fixed;
      transform: translate(-50%, 12px);
      transition: opacity 140ms ease, transform 140ms ease;
      z-index: 3;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    footer {
      color: #4f6673;
      font-size: 12px;
      line-height: 1.5;
      margin: 22px auto 0;
      max-width: 560px;
      text-align: center;
    }

    .footer-install {
      margin: 0 0 10px;
    }

    .install-footer-button {
      background: transparent;
      border: 0;
      color: #24566b;
      cursor: pointer;
      font: inherit;
      padding: 0;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .install-modal[hidden] {
      display: none;
    }

    .install-modal {
      align-items: center;
      background: rgba(7, 22, 31, 0.42);
      display: flex;
      inset: 0;
      justify-content: center;
      padding: 18px;
      position: fixed;
      z-index: 4;
    }

    .install-dialog {
      background: #f9fdff;
      border: 1px solid #b8d8e6;
      border-radius: 8px;
      box-shadow: 0 18px 42px rgba(7, 22, 31, 0.22);
      color: #10202a;
      max-width: 420px;
      padding: 18px;
      width: 100%;
    }

    .install-dialog h2 {
      font-size: 18px;
      margin: 0 28px 8px 0;
    }

    .install-dialog p {
      color: #2d4b59;
      font-size: 14px;
      line-height: 1.55;
      margin: 0 0 16px;
    }

    .install-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .install-primary,
    .install-secondary {
      align-items: center;
      display: inline-flex;
      justify-content: center;
      min-height: 38px;
      padding: 8px 12px;
      text-decoration: none;
    }

    .install-primary {
      background: #10202a;
      border: 1px solid #10202a;
      color: #ffffff;
    }

    .install-secondary {
      background: #ffffff;
      border: 1px solid #b8d8e6;
      color: #264a5b;
    }

    .install-close {
      background: transparent;
      border: 0;
      color: #526b78;
      font-size: 22px;
      height: 34px;
      line-height: 1;
      padding: 0;
      position: absolute;
      right: 10px;
      top: 8px;
      width: 34px;
    }

    .install-dialog-header {
      position: relative;
    }

    .install-note {
      color: #5b6e78;
      display: block;
      font-size: 12px;
      line-height: 1.45;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-row">
      <h1>양파군 대피소</h1>
      <button class="install-button" id="install-open" type="button">설치 안내</button>
    </div>
    <nav class="tabs" id="category-tabs" aria-label="양파군 분류"></nav>
  </header>
  <main id="app"></main>
  <div class="install-modal" id="install-modal" role="dialog" aria-modal="true" aria-labelledby="install-title" hidden>
    <div class="install-dialog">
      <div class="install-dialog-header">
        <h2 id="install-title">양파군을 더 편하게 사용하세요</h2>
        <button class="install-close" id="install-close" type="button" aria-label="설치 안내 닫기">×</button>
      </div>
      <p id="install-message"></p>
      <div class="install-actions" id="install-actions"></div>
      <span class="install-note" id="install-note"></span>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite">복사했습니다.</div>
  <script src="mobile.js"></script>
</body>
</html>
